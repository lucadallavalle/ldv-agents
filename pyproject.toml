[project]
name = "ldv-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca Dalla Valle", email = "luca.dallavalle@outlook.com" }
]
requires-python = "==3.13.12"
dependencies = [
    "deepagents>=0.4.3",
    "langchain-anthropic>=1.3.4",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.0.9",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "rich>=14.3.3",
    "tomli>=2.0.1",
    "typer>=0.24.1",
]

[project.scripts]
ldv-agents = "ldv_agents.main:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
